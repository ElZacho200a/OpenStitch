<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#33475b"/></marker></defs><rect width="760" height="300" fill="white"/><text x="30" y="26" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#33475b" font-weight="bold">Enregistrement DST : 3 octets = déplacement (dx, dy) en unités de 0,1 mm</text><rect x="60" y="50" width="200" height="40" rx="6" fill="#fbf3e6" stroke="#b5791f" stroke-width="1.4"/><text x="160.0" y="74.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#12233d">octet 1</text><rect x="280" y="50" width="200" height="40" rx="6" fill="#fbf3e6" stroke="#b5791f" stroke-width="1.4"/><text x="380.0" y="74.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#12233d">octet 2</text><rect x="500" y="50" width="200" height="40" rx="6" fill="#fbf3e6" stroke="#b5791f" stroke-width="1.4"/><text x="600.0" y="74.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#12233d">octet 3</text><text x="60" y="120" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#33475b">Bits de valeur : ±1, ±3, ±9, ±27, ±81 (ternaire équilibré)</text><text x="60" y="140" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#33475b">Octet 3, bits hauts : type de commande</text><rect x="60" y="160" width="300" height="34" rx="6" fill="#eef6ea" stroke="#3f7a4e" stroke-width="1.4"/><text x="210.0" y="180.66666666666666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#12233d">0b..11 (bas) → point normal (Stitch)</text><rect x="60" y="200" width="300" height="34" rx="6" fill="#eef6ea" stroke="#3f7a4e" stroke-width="1.4"/><text x="210.0" y="220.66666666666666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#12233d">bit 7 → saut (Jump)</text><rect x="380" y="160" width="320" height="34" rx="6" fill="#eef6ea" stroke="#3f7a4e" stroke-width="1.4"/><text x="540.0" y="180.66666666666666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#12233d">bits 7+6 → changement de couleur (arrêt)</text><rect x="380" y="200" width="320" height="34" rx="6" fill="#fde7e7" stroke="#b23" stroke-width="1.4"/><text x="540.0" y="220.66666666666666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#12233d">0x00 0x00 0xF3 → fin (End)</text><text x="60" y="268" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#33475b">En-tête ASCII de 512 octets (LA, ST, CO, ±X, ±Y, AX, AY) calculé après le corps.</text></svg>
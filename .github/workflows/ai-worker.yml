name: AI worker (backend protocol)

on:
  pull_request:
    paths:
      - 'ai-worker/**'
      - 'tests/scripts/test_ai_worker.py'
      - '.github/workflows/ai-worker.yml'
  push:
    branches: [main]
    paths:
      - 'ai-worker/**'
      - 'tests/scripts/test_ai_worker.py'
      - '.github/workflows/ai-worker.yml'

permissions:
  contents: read

jobs:
  python-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Worker protocol tests (stdlib only, no model, no download)
        run: python3 -m unittest discover -s tests/scripts -p 'test_ai_worker.py' -v

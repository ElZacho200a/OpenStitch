name: Mise en forme ponctuelle de la PR MCP
on:
  push:
    branches:
      - fix/mcp-client-audit-20261028
permissions:
  contents: write
jobs:
  format-mcp-pr:
    if: github.repository == 'ElZacho200a/OpenStitch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/mcp-client-audit-20261028
          persist-credentials: true
      - name: Installer clang-format identique a la CI
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Corriger uniquement les sources C++ de la PR
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git diff --name-only -z origin/main...HEAD -- '*.cpp' '*.hpp' | xargs -0 -r clang-format -i
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -u -- '*.cpp' '*.hpp'
            git commit -m 'style(mcp): appliquer clang-format sur les sources de la PR'
            git push origin HEAD:refs/heads/fix/mcp-client-audit-20261028
          fi

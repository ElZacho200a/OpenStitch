name: Publish Linux CLI

# GitHub-token-driven merges may not trigger a main-push CI run. A scheduled
# refresh plus workflow_dispatch keeps a persistent Linux CLI available.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/linux-cli-release.yml'
      - 'packaging/linux/**'
      - 'apps/cli/**'
      - 'libs/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'vcpkg.json'
  schedule:
    - cron: '19 3 * * *'

permissions:
  contents: write

env:
  VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'

jobs:
  publish-linux-cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    concurrency:
      group: openstitch-latest-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Export GitHub Actions cache environment (vcpkg)
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: Set up vcpkg
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y nasm
      - name: Build and run core/CLI tests
        shell: bash
        run: |
          cmake --preset linux-core
          cmake --build --preset linux-core -j "$(nproc)"
          ctest --preset linux-core
      - name: Build Linux CLI Release and smoke test
        shell: bash
        run: |
          cmake -S . -B build/linux-cli-release \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENSTITCH_BUILD_DESKTOP=OFF \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build build/linux-cli-release --target openstitch-cli -j "$(nproc)"
          bash packaging/linux/package-cli.sh \
            build/linux-cli-release/apps/cli/openstitch-cli dist/linux-cli
          (cd dist/linux-cli && sha256sum -c openstitch-cli-linux-x86_64.tar.gz.sha256)
      - name: Test installer script
        run: bash tests/scripts/test-install-cli-linux.sh
      - name: Upload verified Linux CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: openstitch-cli-linux-x86_64
          retention-days: 30
          if-no-files-found: error
          path: dist/linux-cli/*
      - name: Publish/repair release latest without deleting Windows assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload latest \
              dist/linux-cli/openstitch-cli-linux-x86_64.tar.gz \
              dist/linux-cli/openstitch-cli-linux-x86_64.tar.gz.sha256 \
              --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create latest \
              dist/linux-cli/openstitch-cli-linux-x86_64.tar.gz \
              dist/linux-cli/openstitch-cli-linux-x86_64.tar.gz.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --title 'Dernier build (main)' \
              --notes "CLI Linux construite depuis main ($GITHUB_SHA)" \
              --target "$GITHUB_SHA"
          fi

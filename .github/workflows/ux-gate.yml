name: UX Gate — Studio

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  ux-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test the UX gate itself
        run: python -m unittest discover -s tests/scripts -p 'test_ux_*.py' -v

      - name: Read changed filenames from GitHub
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
            --jq '.[].filename' > "$RUNNER_TEMP/ux-changed-files.txt"

      - name: Check novice journey, click count, screenshot and independent review evidence
        if: github.event_name == 'pull_request'
        env:
          UX_PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python scripts/ux/verify.py check-pr \
            --changed-files "$RUNNER_TEMP/ux-changed-files.txt" \
            --body-env UX_PR_BODY

# Actual Studio screenshots are captured in the existing Windows CI build using
# scripts/ux/verify.py capture; images and report are uploaded as CI artifacts.
# Branch protection must require this check to make it unskippable at merge time.

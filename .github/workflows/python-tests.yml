name: Tests Python (scripts)

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/scripts/**'
      - '.github/workflows/python-tests.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/scripts/**'
      - '.github/workflows/python-tests.yml'

permissions:
  contents: read

jobs:
  python-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Tous les tests Python (échoue si un test_*.py casse)
        run: python3 -m unittest discover -s tests/scripts -v

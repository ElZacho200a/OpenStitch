name: Agent bulk edit

on:
  pull_request:
    paths:
      - 'scripts/openstitch_bulk_edit.py'
      - 'tests/scripts/test_openstitch_bulk_edit.py'
      - '.github/workflows/agent-bulk.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/openstitch_bulk_edit.py'
      - 'tests/scripts/test_openstitch_bulk_edit.py'
      - '.github/workflows/agent-bulk.yml'

permissions:
  contents: read

jobs:
  python-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test bulk editing without OpenStitch binary
        run: python3 -m unittest discover -s tests/scripts -p 'test_openstitch_bulk_edit.py' -v

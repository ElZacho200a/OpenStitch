name: Contributor forms
on:
  pull_request:
    paths:
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/workflows/community-templates.yml'
      - 'CONTRIBUTING.md'
      - 'scripts/community/**'
  push:
    branches: [main]
    paths:
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/workflows/community-templates.yml'
      - 'CONTRIBUTING.md'
      - 'scripts/community/**'
permissions:
  contents: read
jobs:
  forms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML==6.0.2'
      - run: python -m unittest discover -s scripts/community -p 'test_*.py' -v

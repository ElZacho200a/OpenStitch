name: Agent evaluation contract

on:
  pull_request:
    paths:
      - 'scripts/openstitch_evaluate.py'
      - 'tests/scripts/test_openstitch_evaluate.py'
      - '.claude/skills/openstitch-evaluate/**'
      - '.github/workflows/agent-evaluation.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/openstitch_evaluate.py'
      - 'tests/scripts/test_openstitch_evaluate.py'
      - '.claude/skills/openstitch-evaluate/**'
      - '.github/workflows/agent-evaluation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test evaluation contract (no model, no network, no native CLI)
        run: python3 -m unittest discover -s tests/scripts -p 'test_openstitch_evaluate.py' -v

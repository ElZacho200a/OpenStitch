name: IA-AUTO-01 ranker (stdlib)

on:
  push:
    paths:
      - 'scripts/auto_digitize_ranker.py'
      - 'tests/scripts/test_auto_digitize_ranker.py'
      - 'docs/ai/ranker-phase2.md'
      - '.github/workflows/auto-digitize-ranker.yml'
  pull_request:
    paths:
      - 'scripts/auto_digitize_ranker.py'
      - 'tests/scripts/test_auto_digitize_ranker.py'
      - 'docs/ai/ranker-phase2.md'
      - '.github/workflows/auto-digitize-ranker.yml'
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: python -m py_compile scripts/auto_digitize_ranker.py tests/scripts/test_auto_digitize_ranker.py
      - name: Ranker contract / training tests
        run: python -m unittest discover -s tests/scripts -p 'test_auto_digitize_ranker.py' -v

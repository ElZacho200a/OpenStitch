name: Third-party machine reader checks

on:
  pull_request:
    paths:
      - 'scripts/interop/**'
      - 'docs/validation/third-party-readers.md'
      - '.github/workflows/interop-readers.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/interop/**'
      - 'docs/validation/third-party-readers.md'
      - '.github/workflows/interop-readers.yml'

permissions:
  contents: read

jobs:
  reader-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent reader
        run: python -m pip install pyembroidery
      - name: Verify reader is importable
        run: python -c "import pyembroidery; assert hasattr(pyembroidery, 'read')"
      - name: Run cross-reader contract tests
        run: python -m unittest discover -s scripts/interop -p 'test_*.py' -v

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un nouveau push sur une PR rend obsolètes les runs précédents de cette PR : ils sont annulés
# (sinon chaque commit lance un build Windows complet, la file des runners s'allonge de plusieurs
# heures et les runs utiles attendent derrière des commits périmés). Les pushes sur main ont un
# groupe unique par commit : jamais annulés ni écrasés, la release de main reste inchangée.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-push-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Commit vcpkg epingle = builtin-baseline de vcpkg.json (a garder identique). Un clone de master
  # change les scripts/ports a chaque commit amont, donc les empreintes ABI des paquets, donc le cache.
  # Cache binaire : backend `files` + actions/cache (le backend `x-gha` a ete retire de vcpkg ;
  # voir docs/source/build-vcpkg-audit.md). VCPKG_BINARY_SOURCES est fixe dans l'etape « Set up vcpkg ».
  VCPKG_COMMIT: 4e82e29f14eac2b3422f18f72c7524d04f19924e

permissions:
  contents: read

jobs:
  # Aiguillage rapide (quelques secondes) : une PR qui ne touche que des fichiers sans effet sur
  # le build ni sur les tests (voir docs/source/build-ci.md) saute les builds lourds. Tout push sur
  # main, tout changement de workflow/CMake/code, et tout doute => validation complète.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Classer les fichiers modifiés
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          code=true
          if [ "$EVENT" = "pull_request" ]; then
            if files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')" && [ -n "$files" ]; then
              # Chemins sans effet sur le build/les tests. Tout le reste compte comme du code.
              # (docs/source, docs/desktop-v2, docs/adr sont lus par des tests CTest : jamais exclus.)
              if ! echo "$files" | grep -Evq '^(\.claude/|docs/agents/|docs/ai/|docs/assets/|\.github/ISSUE_TEMPLATE/|[^/]+\.md$)'; then
                code=false
              fi
            else
              echo '::warning::Liste des fichiers indisponible : validation complète par prudence'
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Validation lourde requise : $code"

  windows-msvc:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Export GitHub Actions cache environment (vcpkg)
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          modules: qtshadertools

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vcpkg-bincache
          key: vcpkg-windows-${{ hashFiles('vcpkg.json') }}-${{ env.VCPKG_COMMIT }}
          restore-keys: vcpkg-windows-

      - name: Set up vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP/vcpkg"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to clone vcpkg' }
          git -C "$env:RUNNER_TEMP/vcpkg" checkout --detach $env:VCPKG_COMMIT
          if ($LASTEXITCODE -ne 0) { throw 'Unable to check out the pinned vcpkg commit' }
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/vcpkg-bincache" | Out-Null
          "VCPKG_BINARY_SOURCES=clear;files,$env:RUNNER_TEMP/vcpkg-bincache,readwrite" | Out-File -Append -FilePath $env:GITHUB_ENV
          # GitHub release assets intermittently return 502/504. Retry only the download,
          # never the build or the tests, and fail if the tool is still unavailable.
          $ready = $false
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            try {
              & "$env:RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
              if ($LASTEXITCODE -eq 0 -and (Test-Path "$env:RUNNER_TEMP/vcpkg/vcpkg.exe")) {
                $ready = $true
                break
              }
            } catch {
              Write-Warning "vcpkg bootstrap attempt $attempt failed: $_"
            }
            if ($attempt -lt 5) { Start-Sleep -Seconds (10 * $attempt) }
          }
          if (-not $ready) { throw 'vcpkg bootstrap failed after 5 attempts' }
          "VCPKG_ROOT=$env:RUNNER_TEMP/vcpkg" | Out-File -Append -FilePath $env:GITHUB_ENV

      - name: Prefetch Boost CMake from official codeload (best effort)
        shell: pwsh
        run: |
          $downloads = Join-Path $env:RUNNER_TEMP 'vcpkg/downloads'
          New-Item -ItemType Directory -Force -Path $downloads | Out-Null
          $target = Join-Path $downloads 'boostorg-cmake-boost-1.91.0.tar.gz'
          $partial = "$target.part"
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              Invoke-WebRequest -Uri 'https://codeload.github.com/boostorg/cmake/tar.gz/refs/tags/boost-1.91.0' -OutFile $partial -TimeoutSec 90
              Move-Item -Force $partial $target
              break
            } catch {
              Remove-Item -ErrorAction SilentlyContinue $partial
              Write-Warning "Boost archive prefetch attempt $attempt failed: $_"
              if ($attempt -lt 3) { Start-Sleep -Seconds (10 * $attempt) }
            }
          }
          # vcpkg independently verifies the archive's SHA512 before using it.

      - name: Configure and build Release
        shell: pwsh
        run: |
          $env:QT_ROOT = $env:QT_ROOT_DIR
          # vcpkg downloads can fail transiently (GitHub archive HTTP 503/504).
          # Retry the complete configure/build command; never skip compilation or tests.
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            ./scripts/build.ps1 -SkipBootstrap -Configuration Release
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) {
              throw "Windows Release build failed after 3 attempts (exit $LASTEXITCODE)"
            }
            Write-Warning "Release build attempt $attempt failed; retrying after transient dependency download outage..."
            Start-Sleep -Seconds 20
          }

      # Sauvegarde meme si la compilation echoue (les paquets vcpkg deja construits restent utiles) ;
      # uniquement sur main pour ne pas saturer le quota de 10 Go du depot.
      - name: Save vcpkg binary cache
        # success() : jamais d'enregistrement après une configuration ratée (cache vide figé).
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.vcpkg-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vcpkg-bincache
          key: vcpkg-windows-${{ hashFiles('vcpkg.json') }}-${{ env.VCPKG_COMMIT }}

      # Disponible des la compilation, meme si les tests suivants echouent (build Release seul).
      # La publication stable reste conditionnee au succes de tous les jobs.
      - name: Upload Windows beta binaries
        uses: actions/upload-artifact@v4
        with:
          name: openstitch-beta-windows-x64
          if-no-files-found: error
          retention-days: 30
          path: |
            build/msvc/apps/desktop/Release/
            build/msvc/apps/cli/Release/
            build/msvc/apps/mcp/Release/
            build/msvc/apps/desktop_v2/studio/Release/

      # Un seul binaire fait foi : le CLI construit sur le SHA de cette PR,
      # pas une ancienne archive téléchargée d'une CI précédente.
      - name: QA fondus — 20 variantes / OSP / DST / previews
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          OPENSTITCH_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $env:OPENSTITCH_CLI = Join-Path $PWD "build/msvc/apps/cli/Release/openstitch-cli.exe"
          python scripts/qa_pr336_gradients.py
          if ($LASTEXITCODE -ne 0) { throw 'QA fondu : generation OSP/DST/PNG impossible' }

      - name: Upload fondus — vrais projets, exports et previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-pr336-current-commit
          path: qa-gradient-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Build and capture experimental Qt Quick Studio
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PATH = "$env:QT_ROOT_DIR/bin;$env:PATH"
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QT_QUICK_BACKEND = 'software'
          $env:QT_QPA_FONTDIR = Join-Path $PWD 'resources/fonts'
          $env:QT_QPA_PLATFORM_PLUGIN_PATH = Join-Path $env:QT_ROOT_DIR 'plugins/platforms'
          cmake --build --preset msvc-release --target openstitch_v2_studio test_desktop_v2_studio_shell openstitch-studio-bench
          if ($LASTEXITCODE -ne 0) { throw 'Studio build failed' }
          New-Item -ItemType Directory -Force -Path dist/studio-screenshots | Out-Null
          & build/msvc/tests/bench/Release/openstitch-studio-bench.exe --generate-project dist/studio-screenshots/tentabrode-300mm.osp --image tests/fixtures/tentabrode.png --height-mm 300
          if ($LASTEXITCODE -ne 0) { throw 'Studio real-project fixture generation failed' }
          $output = Join-Path (Resolve-Path dist/studio-screenshots) 'studio-software.png'
          $project = Join-Path (Resolve-Path dist/studio-screenshots) 'tentabrode-300mm.osp'
          $process = Start-Process -FilePath build/msvc/apps/desktop_v2/studio/Release/openstitch.exe -ArgumentList @(
            "`"$project`"", '--software', '--screenshot', "`"$output`""
          ) -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0 -or -not (Test-Path $output)) { throw 'Studio screenshot failed' }
          # Second UX pass: all four Studio spaces, at normal and narrow window sizes.
          # Qt is already configured to run offscreen/software on this Windows runner.
          python scripts/ux/verify.py capture --studio build/msvc/apps/desktop_v2/studio/Release/openstitch.exe --project $project --out dist/studio-screenshots/ux --backend software
          if ($LASTEXITCODE -ne 0) { throw 'Studio UX screenshot matrix failed' }


      - name: Upload actual Qt Studio screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openstitch-studio-screenshots-windows
          if-no-files-found: warn
          retention-days: 30
          path: |
            dist/studio-screenshots/*.png
            dist/studio-screenshots/ux/*.png
            dist/studio-screenshots/ux/report.json

      - name: Test (Release)
        run: ctest --preset msvc-release --output-on-failure

      - name: Package and smoke-test Windows MCP (Release)
        shell: pwsh
        run: |
          ./packaging/windows/package-mcp.ps1 -BinaryDir build/msvc/apps/mcp/Release -OutputDir dist/windows-mcp
          $verify = Join-Path $env:RUNNER_TEMP "openstitch-mcp-smoke"
          Expand-Archive -LiteralPath "dist/windows-mcp/openstitch-mcp-windows-x64.zip" -DestinationPath $verify -Force
          $exe = Join-Path $verify "openstitch-mcp-windows-x64/openstitch-mcp.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "MCP exe missing from ZIP" }
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "MCP --version failed" }
          & $exe --doctor
          if ($LASTEXITCODE -ne 0) { throw "MCP --doctor failed" }

      - name: Upload Windows MCP ZIP + SHA256
        uses: actions/upload-artifact@v4
        with:
          name: openstitch-mcp-windows-x64
          if-no-files-found: error
          retention-days: 30
          path: dist/windows-mcp/*

      # Diagnostic : test_ui_action_workflows échoue par intermittence en Release sans aucun message
      # (ctest n'affiche que « Failed », ni sortie ni code de sortie). Quand un test échoue, on relance
      # les tests échoués avec la sortie complète, puis ce test 5 fois directement avec la sortie
      # écrite dans un fichier (une sortie standard perdue à la sortie du processus ne masque plus
      # rien) et son code de sortie. N'affecte pas le résultat du job (déjà en échec).
      - name: Diagnose failed tests (Release)
        if: failure()
        continue-on-error: true
        shell: pwsh
        run: |
          ctest --preset msvc-release --rerun-failed -VV
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH"
          $env:QT_QPA_PLATFORM = "offscreen"
          # PR #164: le test_properties_panel échoue sous Windows sans sortie CTest.
          # Lancer directement les deux exécutables suspects et afficher le journal
          # QTest même en cas de code de sortie non nul (assertion ou crash).
          foreach ($testName in @("test_properties_panel", "test_ui_action_workflows", "test_desktop_v2_shell", "test_desktop_v2_studio_files")) {
            $exe = if ($testName -in @("test_desktop_v2_shell", "test_desktop_v2_studio_files")) { "build/msvc/tests/unit/desktop_v2/Release/$testName.exe" } else { "build/msvc/tests/unit/desktop/Release/$testName.exe" }
            foreach ($i in 1..2) {
              $log = "diag-$testName-$i.txt"
              & $exe -o "$log,txt"
              $code = $LASTEXITCODE
              "${testName} run ${i}: code de sortie $code (0x{0:X})" -f $code
              if (Test-Path $log) {
                if ($testName -in @("test_desktop_v2_shell", "test_desktop_v2_studio_files")) { Get-Content $log | Select-String -Pattern "FAIL|Totals:|Finished testing|QFATAL" } else { Get-Content $log -Tail 120 }
              } else {
                "Journal QTest absent: $log"
              }
            }
          }

  # Garde-fou de portabilité : le cœur et la CLI doivent compiler sans Qt
  # et sans dépendance Windows involontaire.
  linux-core:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Pinned runner: avoids silently raising the glibc baseline of the binary.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Export GitHub Actions cache environment (vcpkg)
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vcpkg-bincache
          # v2 : l'entrée v1 avait été enregistrée VIDE (206 o) après une configuration ratée ; sa
          # clé exacte empêchait toute réécriture, si bien que chaque job recompilait et
          # retéléchargeait toutes les dépendances (pannes 503/429 de GitHub). Repli sur le cache
          # du workflow de release (même preset) : vcpkg ne reprend que les paquets d'ABI identique.
          key: vcpkg-linux-v2-${{ hashFiles('vcpkg.json') }}-${{ env.VCPKG_COMMIT }}
          restore-keys: |
            vcpkg-linux-v2-
            vcpkg-release-linux-

      - name: Set up vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout --detach "$VCPKG_COMMIT"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/vcpkg-bincache"
          echo "VCPKG_BINARY_SOURCES=clear;files,$RUNNER_TEMP/vcpkg-bincache,readwrite" >> "$GITHUB_ENV"

      - name: Prefetch Boost CMake from official codeload (best effort)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/vcpkg/downloads"
          target="$RUNNER_TEMP/vcpkg/downloads/boostorg-cmake-boost-1.91.0.tar.gz"
          if curl --fail --location --retry 5 --retry-all-errors --max-time 90 \
            --output "$target.part" \
            'https://codeload.github.com/boostorg/cmake/tar.gz/refs/tags/boost-1.91.0'; then
            mv "$target.part" "$target"
          else
            rm -f "$target.part"
            echo '::warning::Boost archive prefetch failed; vcpkg will try the original URL'
          fi
          # vcpkg verifies the SHA512 hash itself; this does not bypass integrity checks.

      # Hors cache binaire, vcpkg retélécharge des correctifs « commit/<sha>.patch|.diff » auxquels
      # GitHub répond 503, et des archives GitLab qui répondent 429 (2026-11-20 : trois configurations
      # ratées de suite). Correctifs copiés dans le dépôt, archives préchargées avec des reprises
      # patientes ; rien n'est déposé si le vcpkg épinglé n'attend pas l'empreinte, et vcpkg revérifie
      # chaque SHA512. Voir .github/vcpkg-downloads/README.md.
      - name: Seed vcpkg downloads (mirrored patches, patient prefetch)
        run: bash .github/vcpkg-downloads/seed.sh "$RUNNER_TEMP/vcpkg"

      - name: System dependencies (OpenCV via vcpkg)
        run: sudo apt-get update && sudo apt-get install -y nasm

      # Retry a temporary upstream vcpkg download outage (e.g. freetype GitLab SSL).
      # Preserve failure on the last attempt; this is not a bypass of build/tests.
      - name: Configure
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if cmake --preset linux-core; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo 'CMake/vcpkg configuration failed after 3 attempts' >&2
              exit 1
            fi
            echo "Configure attempt $attempt failed; retrying external downloads…" >&2
            sleep 15
          done

      - name: Save vcpkg binary cache
        # success() : jamais d'enregistrement après une configuration ratée (cache vide figé).
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.vcpkg-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vcpkg-bincache
          key: vcpkg-linux-v2-${{ hashFiles('vcpkg.json') }}-${{ env.VCPKG_COMMIT }}

      - name: Build
        run: cmake --build --preset linux-core -j "$(nproc)"

      - name: Test malformed OSP with the compiled CLI
        run: |
          python3 -m unittest discover -s scripts/qa -p 'test_*.py' -v
          python3 scripts/qa/fuzz_osp.py --cli build/linux-core/apps/cli/openstitch-cli

      - name: Test
        run: ctest --preset linux-core --output-on-failure

      - name: Test Linux CLI installer
        run: bash tests/scripts/test-install-cli-linux.sh

      # Keep the Debug/test build intact; create a separate Release CLI.
      # The archive is uploaded only after the Linux tests and smoke checks succeed.
      - name: Build Linux CLI (Release)
        run: |
          cmake -S . -B build/linux-cli-release \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENSTITCH_BUILD_DESKTOP=OFF \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build build/linux-cli-release --target openstitch-cli -j "$(nproc)"
          bash packaging/linux/package-cli.sh \
            build/linux-cli-release/apps/cli/openstitch-cli dist/linux-cli

      - name: Build and package Linux MCP server (Release)
        run: |
          cmake --build build/linux-cli-release --target openstitch-mcp -j "$(nproc)"
          bash packaging/linux/package-mcp.sh \
            build/linux-cli-release/apps/mcp/openstitch-mcp dist/linux-mcp

      - name: Upload Linux MCP binary and checksum
        uses: actions/upload-artifact@v4
        with:
          name: openstitch-mcp-linux-x86_64
          if-no-files-found: error
          retention-days: 30
          path: dist/linux-mcp/*

      - name: Upload Linux CLI binary and checksum
        uses: actions/upload-artifact@v4
        with:
          name: openstitch-cli-linux-x86_64
          if-no-files-found: error
          retention-days: 30
          path: dist/linux-cli/*

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: clang-format (vérification, sans modification)
        run: |
          sudo apt-get update && sudo apt-get install -y clang-format-18
          v="$(clang-format-18 --version)"
          echo "$v"
          case "$v" in
            *"version 18."*) ;;
            *) echo "clang-format 18.x requis (règle du dépôt), obtenu : $v" >&2; exit 1 ;;
          esac
          git ls-files '*.cpp' '*.hpp' | xargs clang-format-18 --dry-run --Werror

  # Point de contrôle unique (à exiger dans la protection de branche) : vert seulement si les trois
  # jobs ont réussi, ou s'ils ont été sautés par l'aiguillage `changes` (PR sans code). Un job
  # échoué, annulé ou un aiguillage en erreur rend ce contrôle rouge : rien n'est masqué.
  ci-gate:
    name: CI complète
    needs: [changes, windows-msvc, linux-core, format]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Vérifier les résultats
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          WINDOWS: ${{ needs.windows-msvc.result }}
          LINUX: ${{ needs.linux-core.result }}
          FORMAT: ${{ needs.format.result }}
        run: |
          echo "changes=$CHANGES code=$CODE windows=$WINDOWS linux=$LINUX format=$FORMAT"
          [ "$CHANGES" = success ] || { echo 'aiguillage en échec' >&2; exit 1; }
          [ "$FORMAT" = success ] || { echo 'format en échec' >&2; exit 1; }
          if [ "$CODE" = true ]; then
            [ "$WINDOWS" = success ] && [ "$LINUX" = success ] || { echo 'build/tests en échec' >&2; exit 1; }
          else
            [ "$WINDOWS" = skipped ] && [ "$LINUX" = skipped ] || { echo 'résultat inattendu' >&2; exit 1; }
          fi

  # Publie l'exécutable Windows sur une release GitHub "latest", uniquement
  # une fois que build + tests + garde-fou Linux + formatage sont tous verts
  # sur main. La release est glissante : chaque push sur main remplace le
  # tag et les binaires précédents.
  release:
    name: Release GitHub (dernier build de main)
    needs: [windows-msvc, linux-core, format, ci-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: openstitch-latest-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Télécharger l'artefact Windows
        uses: actions/download-artifact@v4
        with:
          name: openstitch-beta-windows-x64
          path: dist/openstitch-windows-x64

      - name: Télécharger l'archive Windows MCP
        uses: actions/download-artifact@v4
        with:
          name: openstitch-mcp-windows-x64
          path: dist/windows-mcp

      - name: Télécharger l'artefact Linux CLI
        uses: actions/download-artifact@v4
        with:
          name: openstitch-cli-linux-x86_64
          path: dist/linux-cli

      - name: Télécharger l'artefact Linux MCP
        uses: actions/download-artifact@v4
        with:
          name: openstitch-mcp-linux-x86_64
          path: dist/linux-mcp

      - name: Empaqueter
        run: |
          cd dist
          zip -r ../openstitch-windows-x64.zip openstitch-windows-x64

      - name: Publier/remplacer la release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Never delete the release: download URLs must remain stable.
          if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload latest \
              openstitch-windows-x64.zip \

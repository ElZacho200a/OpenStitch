name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Export GitHub Actions cache environment (vcpkg)
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64

      - name: Set up vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP/vcpkg"
          & "$env:RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$env:RUNNER_TEMP/vcpkg" | Out-File -Append -FilePath $env:GITHUB_ENV

      - name: Configure and build Release
        shell: pwsh
        run: |
          $env:QT_ROOT = $env:QT_ROOT_DIR
          ./scripts/build.ps1 -SkipBootstrap -Configuration Release

      # Disponible des la compilation, meme si les tests suivants echouent (build Release seul).
      # La publication stable reste conditionnee au succes de tous les jobs.
      - name: Upload Windows beta binaries
        uses: actions/upload-artifact@v4
        with:
          name: openstitch-beta-windows-x64
          if-no-files-found: error
          retention-days: 30
          path: |
            build/msvc/apps/desktop/Release/
            build/msvc/apps/cli/Release/

      - name: Test (Release)
        run: ctest --preset msvc-release

      # Diagnostic : test_ui_action_workflows échoue par intermittence en Release sans aucun message
      # (ctest n'affiche que « Failed », ni sortie ni code de sortie). Quand un test échoue, on relance
      # les tests échoués avec la sortie complète, puis ce test 5 fois directement avec la sortie
      # écrite dans un fichier (une sortie standard perdue à la sortie du processus ne masque plus
      # rien) et son code de sortie. N'affecte pas le résultat du job (déjà en échec).
      - name: Diagnose failed tests (Release)
        if: failure()
        continue-on-error: true
        shell: pwsh
        run: |
          ctest --preset msvc-release --rerun-failed -VV
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH"
          $env:QT_QPA_PLATFORM = "offscreen"
          $exe = "build/msvc/tests/unit/desktop/Release/test_ui_action_workflows.exe"
          foreach ($i in 1..5) {
            & $exe -o "diag-run$i.txt,txt" | Out-Null
            $code = $LASTEXITCODE
            "run ${i}: code de sortie $code (0x{0:X})" -f $code
            if ($code -ne 0 -and (Test-Path "diag-run$i.txt")) {
              Get-Content "diag-run$i.txt" -Tail 80
            }
          }

  # Garde-fou de portabilité : le cœur et la CLI doivent compiler sans Qt
  # et sans dépendance Windows involontaire.
  linux-core:
    # Pinned runner: avoids silently raising the glibc baseline of the binary.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Export GitHub Actions cache environment (vcpkg)
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Set up vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"

      - name: System dependencies (OpenCV via vcpkg)
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Configure
        run: cmake --preset linux-core

      - name: Build
        run: cmake --build --preset linux-core -j "$(nproc)"

      - name: Test malformed OSP with the compiled CLI
        run: |
          python3 -m unittest discover -s scripts/qa -p 'test_*.py' -v
          python3 scripts/qa/fuzz_osp.py --cli build/linux-core/apps/cli/openstitch-cli

      - name: Test
        run: ctest --preset linux-core

      - name: Test Linux CLI installer
        run: bash tests/scripts/test-install-cli-linux.sh

      # Keep the Debug/test build intact; create a separate Release CLI.
      # The archive is uploaded only after the Linux tests and smoke checks succeed.
      - name: Build Linux CLI (Release)
        run: |
          cmake -S . -B build/linux-cli-release \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENSTITCH_BUILD_DESKTOP=OFF \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build build/linux-cli-release --target openstitch-cli -j "$(nproc)"
          bash packaging/linux/package-cli.sh \
            build/linux-cli-release/apps/cli/openstitch-cli dist/linux-cli

      - name: Upload Linux CLI binary and checksum
        uses: actions/upload-artifact@v4
        with:
          name: openstitch-cli-linux-x86_64
          if-no-files-found: error
          retention-days: 30
          path: dist/linux-cli/*

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: clang-format (vérification, sans modification)
        run: |
          sudo apt-get update && sudo apt-get install -y clang-format
          git ls-files '*.cpp' '*.hpp' | xargs clang-format --dry-run --Werror

  # Publie l'exécutable Windows sur une release GitHub "latest", uniquement
  # une fois que build + tests + garde-fou Linux + formatage sont tous verts
  # sur main. La release est glissante : chaque push sur main remplace le
  # tag et les binaires précédents.
  release:
    name: Release GitHub (dernier build de main)
    needs: [windows-msvc, linux-core, format]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: openstitch-latest-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Télécharger l'artefact Windows
        uses: actions/download-artifact@v4
        with:
          name: openstitch-beta-windows-x64
          path: dist/openstitch-windows-x64

      - name: Télécharger l'artefact Linux CLI
        uses: actions/download-artifact@v4
        with:
          name: openstitch-cli-linux-x86_64
          path: dist/linux-cli

      - name: Empaqueter
        run: |
          cd dist
          zip -r ../openstitch-windows-x64.zip openstitch-windows-x64

      - name: Publier/remplacer la release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Never delete the release: download URLs must remain stable.
          if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload latest \
              openstitch-windows-x64.zip \
              dist/linux-cli/openstitch-cli-linux-x86_64.tar.gz \
              dist/linux-cli/openstitch-cli-linux-x86_64.tar.gz.sha256 \
              --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create latest \
              openstitch-windows-x64.zip \
              dist/linux-cli/openstitch-cli-linux-x86_64.tar.gz \
              dist/linux-cli/openstitch-cli-linux-x86_64.tar.gz.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --title "Dernier build (main)" \
              --notes "Build automatique généré depuis le commit ${{ github.sha }}." \
              --target "${{ github.sha }}"
          fi
